[project]
name = "python-example"
version = "0.1.0"
description = "Minimal Python package in a Turbo workspace"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "build", "hatchling>=1.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/python_example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
